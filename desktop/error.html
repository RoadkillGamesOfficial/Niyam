<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Niyam could not start</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f3e3c3;
        color: #3b2b1b;
        font: 15px/1.5 "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 560px;
        background: #fbf3e2;
        border: 3px solid #6b4a2f;
        border-radius: 4px;
        padding: 24px;
        box-shadow: 0 4px 0 #6b4a2f;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 19px;
      }
      p {
        margin: 0 0 12px;
      }
      pre {
        margin: 0 0 16px;
        padding: 10px;
        max-height: 190px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
        background: #efe0c6;
        border: 1px solid #c9ab84;
        font-size: 12px;
        line-height: 1.45;
      }
      .actions {
        display: flex;
        gap: 10px;
      }
      button {
        font: inherit;
        padding: 10px 18px;
        border: 2px solid #4d6630;
        border-radius: 4px;
        background: #7d9b4e;
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: #efe0c6;
        border-color: #8a6a4a;
        color: #3b2b1b;
      }
      button:focus-visible {
        outline: 3px solid #3f6f8f;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Niyam could not start</h1>
      <p>The local server did not come up. This is what it reported:</p>
      <pre id="reason">No reason was recorded.</pre>
      <div class="actions">
        <button id="retry" type="button">Retry</button>
        <button id="quit" class="secondary" type="button">Quit</button>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const reason = params.get("reason");
      if (reason) {
        document.getElementById("reason").textContent = reason;
      }
      document.getElementById("retry").addEventListener("click", () => {
        window.niyam?.retry();
      });
      document.getElementById("quit").addEventListener("click", () => {
        window.niyam?.quit();
      });
    </script>
  </body>
</html>
